{% extends 'admin/base.html' %}
{% block title %}Books{% endblock %}
{% block content %}
<div class="order-head"><h1>Manage books</h1><a class="btn" href="{{ url_for('admin.add_book') }}">+ Add book</a></div>
<div class="table-wrap"><table>
  <tr><th>ID</th><th>Title</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
  {% for b in books %}
  <tr id="book-row-{{ b.id }}">
    <td>{{ b.id }}</td><td><strong>{{ b.title }}</strong><br><span class="muted">{{ b.author }}</span></td>
    <td>{{ b.category }}</td><td>{{ b.price|inr }}</td>
    <td><input class="stock-input" type="number" min="0" value="{{ b.stock }}" id="stock-{{ b.id }}">
        <button class="btn small stock-save" data-book="{{ b.id }}">Update</button></td>
    <td><a href="{{ url_for('admin.edit_book', book_id=b.id) }}">Edit</a>
        <button class="link-danger book-delete" data-book="{{ b.id }}">Delete</button></td>
  </tr>
  {% endfor %}
</table></div>
{% endblock %}
