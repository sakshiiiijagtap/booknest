<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Admin{% endblock %} | BookNest Admin</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=fullwidth2"></head>
<body class="admin">
<header class="nav"><div class="container nav-inner">
  <a class="logo" href="{{ url_for('admin.dashboard') }}">Book<span>Nest</span> Admin</a>
  <nav class="nav-links">
    <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
    <a href="{{ url_for('admin.books') }}">Books</a>
    <a href="{{ url_for('admin.orders') }}">Orders</a>
    <a href="{{ url_for('admin.users') }}">Users</a>
    <a href="{{ url_for('books.index') }}">View store</a>
    <a href="{{ url_for('admin.admin_logout') }}">Logout</a>
  </nav></div></header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<div id="toast"></div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body></html>
