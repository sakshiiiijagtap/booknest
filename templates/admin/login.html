<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login | BookNest</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="admin"><main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  <form class="panel auth" method="post">
    <h1>Admin login</h1>
    <label>Email<input type="email" name="email" required></label>
    <label>Password<input type="password" name="password" required></label>
    <button class="btn" type="submit">Login</button>
    <p class="muted small-note">Demo admin: admin@booknest.com / Admin@123</p>
  </form>
</main></body></html>
