{% extends 'admin/base.html' %}
{% block title %}{{ 'Edit' if book else 'Add' }} book{% endblock %}
{% block content %}
<h1>{{ 'Edit book' if book else 'Add book' }}</h1>
<form class="panel auth wide" method="post">
  <label>Title<input name="title" value="{{ request.form.get('title', book.title if book else '') }}" required></label>
  <label>Author<input name="author" value="{{ request.form.get('author', book.author if book else '') }}" required></label>
  <label>Category
    <select name="category">
      {% set cur = request.form.get('category', book.category if book else '') %}
      {% for c in categories %}<option value="{{ c }}" {{ 'selected' if c == cur }}>{{ c }}</option>{% endfor %}
    </select></label>
  <div class="row">
    <label>Price (INR)<input name="price" type="number" step="0.01" min="0.01" value="{{ request.form.get('price', book.price if book else '') }}" required></label>
    <label>Stock<input name="stock" type="number" min="0" value="{{ request.form.get('stock', book.stock if book else '') }}" required></label>
  </div>
  <label>Cover image URL (optional)<input name="image_url" value="{{ request.form.get('image_url', book.image_url if book else '') }}"></label>
  <label>Description<textarea name="description" rows="4">{{ request.form.get('description', book.description if book else '') }}</textarea></label>
  <div class="actions"><button class="btn" type="submit">Save</button><a class="btn ghost" href="{{ url_for('admin.books') }}">Cancel</a></div>
</form>
{% endblock %}
